<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ATWORK - สมัครงาน</title>

  <!-- LINE LIFF SDK -->
  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      background: #f4f7fb;

      color: #1f2937;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;

      margin: 0 auto;
    }

    .card {
      background: #ffffff;

      border-radius: 20px;

      padding: 24px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);
    }

    /* ============================
       HEADER
    ============================ */

    .brand {
      text-align: center;

      color: #123c72;

      font-size: 30px;

      font-weight: 800;

      letter-spacing: 0.5px;
    }

    .title {
      margin-top: 6px;

      text-align: center;

      font-size: 22px;

      font-weight: 700;
    }

    .subtitle {
      margin-top: 8px;
      margin-bottom: 24px;

      text-align: center;

      color: #6b7280;

      font-size: 14px;

      line-height: 1.6;
    }


    /* ============================
       LINE STATUS
    ============================ */

    .line-status {
      padding: 11px 12px;

      margin-bottom: 20px;

      border-radius: 10px;

      text-align: center;

      font-size: 13px;

      background: #f8fafc;

      color: #64748b;
    }

    .line-status.success {
      background: #f0fdf4;

      color: #166534;
    }

    .line-status.error {
      background: #fef2f2;

      color: #991b1b;
    }


    /* ============================
       PROFILE
    ============================ */

    .profile {
      display: none;

      padding: 12px 14px;

      margin-bottom: 20px;

      border-radius: 12px;

      background: #f8fafc;

      font-size: 13px;

      color: #64748b;
    }

    .profile.show {
      display: block;
    }

    .profile-name {
      color: #123c72;

      font-weight: 700;
    }


    /* ============================
       SECTION
    ============================ */

    .section-title {
      margin-top: 26px;

      margin-bottom: 14px;

      color: #123c72;

      font-size: 17px;

      font-weight: 700;
    }


    /* ============================
       FORM
    ============================ */

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: 600;
    }

    .required {
      color: #dc2626;
    }

    input,
    select {
      width: 100%;

      height: 48px;

      margin-bottom: 16px;

      padding: 0 14px;

      border: 1px solid #d1d5db;

      border-radius: 10px;

      background: #ffffff;

      color: #111827;

      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    /* ============================
       RESUME
    ============================ */

    .resume-box {
      padding: 16px;

      border: 2px dashed #cbd5e1;

      border-radius: 12px;

      background: #f8fafc;

      margin-bottom: 20px;
    }

    .resume-box input[type="file"] {
      width: 100%;

      height: auto;

      margin: 0;

      padding: 0;

      border: 0;

      background: transparent;

      box-shadow: none;
    }

    .file-name {
      margin-top: 9px;

      color: #475569;

      font-size: 12px;

      line-height: 1.5;
    }

    .hint {
      margin-top: 8px;

      color: #64748b;

      font-size: 12px;

      line-height: 1.5;
    }


    /* ============================
       BUTTON
    ============================ */

    .submit-btn {
      width: 100%;

      height: 50px;

      margin-top: 6px;

      border: none;

      border-radius: 12px;

      background: #123c72;

      color: #ffffff;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }


    /* ============================
       MESSAGE
    ============================ */

    .message {
      display: none;

      margin-top: 18px;

      padding: 15px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.7;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #ecfdf5;

      color: #166534;
    }

    .message.error {
      background: #fef2f2;

      color: #991b1b;
    }


    /* ============================
       FOOTER
    ============================ */

    .note {
      margin-top: 20px;

      text-align: center;

      color: #94a3b8;

      font-size: 11px;

      line-height: 1.6;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">

      <!-- ============================
           HEADER
      ============================ -->

      <div class="brand">
        ATWORK
      </div>

      <div class="title">
        สมัครงาน
      </div>

      <div class="subtitle">
        กรุณากรอกข้อมูลสำหรับสมัครงานให้ครบถ้วน
      </div>


      <!-- ============================
           LINE STATUS
      ============================ -->

      <div
        id="lineStatus"
        class="line-status"
      >
        กำลังเชื่อมต่อ LINE...
      </div>


      <!-- ============================
           PROFILE
      ============================ -->

      <div
        id="profileBox"
        class="profile"
      >

        สวัสดีครับ

        <span
          id="profileName"
          class="profile-name"
        ></span>

      </div>


      <!-- ============================
           FORM
      ============================ -->

      <form id="jobForm">


        <!-- LINE USER ID -->
        <input
          type="hidden"
          id="lineUserId"
          name="lineUserId"
        >


        <!-- ============================
             PERSONAL INFORMATION
        ============================ -->

        <div class="section-title">
          ข้อมูลส่วนตัว
        </div>


        <label for="name">

          ชื่อ-นามสกุล

          <span class="required">
            *
          </span>

        </label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="กรอกชื่อ-นามสกุล"
          autocomplete="name"
          required
        >


        <label for="phone">

          เบอร์โทรศัพท์

          <span class="required">
            *
          </span>

        </label>

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="เช่น 0812345678"
          maxlength="10"
          inputmode="numeric"
          autocomplete="tel"
          required
        >


        <!-- ============================
             JOB INFORMATION
        ============================ -->

        <div class="section-title">
          ข้อมูลการสมัครงาน
        </div>


        <label for="jobType">

          สายงานที่สนใจ

          <span class="required">
            *
          </span>

        </label>

        <select
          id="jobType"
          name="jobType"
          required
        >

          <option value="">
            กำลังโหลดสายงาน...
          </option>

        </select>


        <label for="province">

          จังหวัดที่ต้องการทำงาน

          <span class="required">
            *
          </span>

        </label>

        <select
          id="province"
          name="province"
          required
        >

          <option value="">
            กำลังโหลดจังหวัด...
          </option>

        </select>


        <!-- ============================
             RESUME
        ============================ -->

        <div class="section-title">
          Resume
        </div>


        <div class="resume-box">

          <label for="resume">
            แนบ Resume
          </label>

          <input
            type="file"
            id="resume"
            name="resume"
            accept=".pdf,.doc,.docx"
          >

          <div
            id="fileName"
            class="file-name"
          >
            ยังไม่ได้เลือกไฟล์
          </div>

          <div class="hint">
            รองรับ PDF, DOC และ DOCX
          </div>

        </div>


        <!-- ============================
             SUBMIT
        ============================ -->

        <button
          type="submit"
          id="submitBtn"
          class="submit-btn"
        >
          ส่งใบสมัคร
        </button>


      </form>


      <!-- ============================
           RESULT
      ============================ -->

      <div
        id="result"
        class="message success"
      ></div>


      <!-- ============================
           ERROR
      ============================ -->

      <div
        id="error"
        class="message error"
      ></div>


      <div class="note">
        ATWORK Recruitment
      </div>

    </div>

  </div>


  <script>

    // ==================================================
    // CONFIG
    // ==================================================

    const LIFF_ID =
      "2011817085-Mqy2mWhy";


    // ใส่ URL /exec ของ Apps Script ตรงนี้
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxV0GeGa3dAAX-OKGmJI8uciHeJ-NnpA3YrKVnA45WZkBQBTnWdV3HcrPUuXYS4NnNB/exec";


    // ==================================================
    // DOM
    // ==================================================

    const lineStatus =
      document.getElementById(
        "lineStatus"
      );

    const profileBox =
      document.getElementById(
        "profileBox"
      );

    const profileName =
      document.getElementById(
        "profileName"
      );

    const lineUserId =
      document.getElementById(
        "lineUserId"
      );

    const jobTypeSelect =
      document.getElementById(
        "jobType"
      );

    const provinceSelect =
      document.getElementById(
        "province"
      );

    const resumeInput =
      document.getElementById(
        "resume"
      );

    const fileName =
      document.getElementById(
        "fileName"
      );

    const form =
      document.getElementById(
        "jobForm"
      );

    const submitBtn =
      document.getElementById(
        "submitBtn"
      );


    // ==================================================
    // LIFF
    // ==================================================

    async function initLIFF() {

      try {

        await liff.init({

          liffId:
            LIFF_ID

        });


        /*
         * เปิดจาก LINE App
         */

        if (
          liff.isInClient()
        ) {

          lineStatus.textContent =
            "เชื่อมต่อ LINE เรียบร้อยแล้ว";

          lineStatus.className =
            "line-status success";

        }


        /*
         * เปิดจาก Browser ภายนอก
         */

        else {

          if (
            !liff.isLoggedIn()
          ) {

            liff.login({

              redirectUri:
                window.location.href

            });

            return;

          }

          lineStatus.textContent =
            "เข้าสู่ระบบ LINE เรียบร้อยแล้ว";

          lineStatus.className =
            "line-status success";

        }


        /*
         * อ่าน Profile
         */

        const profile =
          await liff.getProfile();


        /*
         * เก็บ LINE User ID
         */

        lineUserId.value =
          profile.userId || "";


        /*
         * แสดงชื่อผู้ใช้
         */

        profileName.textContent =
          profile.displayName || "";


        profileBox.classList.add(
          "show"
        );


      } catch (error) {

        console.error(
          "LIFF Error:",
          error
        );


        lineStatus.textContent =
          "ไม่สามารถเชื่อมต่อ LINE ได้";


        lineStatus.className =
          "line-status error";


        showError(
          "กรุณาเปิดแบบฟอร์มนี้จาก LINE อีกครั้ง"
        );

      }

    }


    // ==================================================
    // JSONP
    // ใช้สำหรับอ่านข้อมูลจาก Apps Script
    // ==================================================

    function loadJsonp(
      api,
      success,
      fail
    ) {

      /*
       * สร้างชื่อ callback แบบไม่ซ้ำ
       */

      const callbackName =
        "attworkCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      /*
       * สร้าง callback บน window
       */

      window[callbackName] =
        function(data) {

          try {

            success(data);

          } catch (error) {

            console.error(
              error
            );

          } finally {

            delete window[
              callbackName
            ];

            if (
              script &&
              script.parentNode
            ) {

              script.parentNode.removeChild(
                script
              );

            }

          }

        };


      /*
       * สร้าง Script Tag
       */

      const script =
        document.createElement(
          "script"
        );


      /*
       * URL
       */

      script.src =
        APPS_SCRIPT_URL +
        "?api=" +
        encodeURIComponent(api) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      /*
       * กรณีโหลดไม่ได้
       */

      script.onerror =
        function() {

          console.error(
            "โหลด API ไม่สำเร็จ:",
            api
          );


          delete window[
            callbackName
          ];


          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }


          if (fail) {
            fail();
          }

        };


      /*
       * เพิ่ม Script เข้า Page
       */

      document.body.appendChild(
        script
      );

    }


    // ==================================================
    // โหลดสายงาน
    // ==================================================

    function loadJobTypes() {

      jobTypeSelect.innerHTML =
        '<option value="">กำลังโหลดสายงาน...</option>';


      loadJsonp(

        "jobTypes",

        function(jobTypes) {

          jobTypeSelect.innerHTML =
            '<option value="">-- เลือกสายงาน --</option>';


          if (
            !Array.isArray(
              jobTypes
            ) ||
            jobTypes.length === 0
          ) {

            jobTypeSelect.innerHTML +=
              '<option value="">ไม่พบรายการสายงาน</option>';

            return;

          }


          jobTypes.forEach(
            function(jobType) {

              const option =
                document.createElement(
                  "option"
                );


              option.value =
                jobType;


              option.textContent =
                jobType;


              jobTypeSelect.appendChild(
                option
              );

            }
          );

        },

        function() {

          jobTypeSelect.innerHTML =
            '<option value="">โหลดสายงานไม่สำเร็จ</option>';

        }

      );

    }


    // ==================================================
    // โหลดจังหวัด
    // ==================================================

    function loadProvinces() {

      provinceSelect.innerHTML =
        '<option value="">กำลังโหลดจังหวัด...</option>';


      loadJsonp(

        "provinces",

        function(provinces) {

          provinceSelect.innerHTML =
            '<option value="">-- เลือกจังหวัด --</option>';


          if (
            !Array.isArray(
              provinces
            ) ||
            provinces.length === 0
          ) {

            provinceSelect.innerHTML +=
              '<option value="">ไม่พบรายการจังหวัด</option>';

            return;

          }


          provinces.forEach(
            function(province) {

              const option =
                document.createElement(
                  "option"
                );


              option.value =
                province;


              option.textContent =
                province;


              provinceSelect.appendChild(
                option
              );

            }
          );

        },

        function() {

          provinceSelect.innerHTML =
            '<option value="">โหลดจังหวัดไม่สำเร็จ</option>';

        }

      );

    }


    // ==================================================
    // แสดงชื่อ Resume
    // ==================================================

    resumeInput.addEventListener(
      "change",
      function() {

        if (
          resumeInput.files &&
          resumeInput.files.length > 0
        ) {

          fileName.textContent =
            "ไฟล์ที่เลือก: " +
            resumeInput.files[0].name;

        } else {

          fileName.textContent =
            "ยังไม่ได้เลือกไฟล์";

        }

      }
    );


    // ==================================================
    // ตรวจข้อมูลฟอร์ม
    // ==================================================

    function validateForm() {

      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      if (!lineUserId.value) {

        showError(
          "ไม่พบ LINE User ID กรุณาเปิดแบบฟอร์มจาก LINE"
        );

        return false;

      }


      if (!name) {

        showError(
          "กรุณากรอกชื่อ-นามสกุล"
        );

        return false;

      }


      if (
        !/^0\d{9}$/.test(
          phone
        )
      ) {

        showError(
          "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก เช่น 0812345678"
        );

        return false;

      }


      if (
        !jobTypeSelect.value
      ) {

        showError(
          "กรุณาเลือกสายงานที่สนใจ"
        );

        return false;

      }


      if (
        !provinceSelect.value
      ) {

        showError(
          "กรุณาเลือกจังหวัดที่ต้องการทำงาน"
        );

        return false;

      }


      return true;

    }


    // ==================================================
    // Submit
    // ==================================================

    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        hideMessages();


        /*
         * ตรวจข้อมูล
         */

        if (
          !validateForm()
        ) {

          return;

        }


        /*
         * ตอนนี้ยังไม่ส่งข้อมูลจริง
         *
         * เพราะหน้าเว็บอยู่บน GitHub Pages
         * และเราจะทำ Endpoint สำหรับบันทึก
         * Candidates + Resume แยกอีกขั้น
         */

        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const phone =
          document
            .getElementById("phone")
            .value
            .trim();


        const jobType =
          jobTypeSelect.value;


        const province =
          provinceSelect.value;


        console.log({

          lineUserId:
            lineUserId.value,

          name:
            name,

          phone:
            phone,

          jobType:
            jobType,

          province:
            province,

          resume:
            resumeInput.files &&
            resumeInput.files.length > 0
              ? resumeInput.files[0].name
              : ""

        });


        showSuccess(
          "ฟอร์มกรอกข้อมูลครบแล้วครับ<br><br>" +
          "ตอนนี้เราเชื่อมต่อ LIFF และดึงข้อมูลสายงาน/จังหวัดจาก Google Sheets ได้แล้ว<br><br>" +
          "ขั้นต่อไปคือเชื่อมปุ่มนี้กับ Candidates และ Google Drive"
        );

      }
    );


    // ==================================================
    // Success
    // ==================================================

    function showSuccess(
      message
    ) {

      const box =
        document.getElementById(
          "result"
        );


      box.innerHTML =
        message;


      box.classList.add(
        "show"
      );

    }


    // ==================================================
    // Error
    // ==================================================

    function showError(
      message
    ) {

      const box =
        document.getElementById(
          "error"
        );


      box.textContent =
        "❌ " + message;


      box.classList.add(
        "show"
      );

    }


    // ==================================================
    // Hide Messages
    // ==================================================

    function hideMessages() {

      document
        .getElementById("result")
        .classList.remove(
          "show"
        );


      document
        .getElementById("error")
        .classList.remove(
          "show"
        );

    }


    // ==================================================
    // START
    // ==================================================

    initLIFF();

    loadJobTypes();

    loadProvinces();

  </script>

</body>

</html>
