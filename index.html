<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ฝาก Resume | ATWORK</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f4f8ff;

      color: #172033;
    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: 0 auto;

      padding: 24px 18px 40px;
    }


    .header {

      text-align: center;

      margin-bottom: 24px;
    }


    .logo {

      font-size: 32px;

      font-weight: 800;

      color: #0a2a5e;

      letter-spacing: 1px;
    }


    .subtitle {

      margin-top: 8px;

      color: #667085;

      font-size: 15px;

      line-height: 1.6;
    }


    .card {

      background: white;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 10px 30px rgba(12, 38, 80, 0.08);
    }


    .field {

      margin-bottom: 18px;
    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 700;
    }


    input[type="text"],
    input[type="tel"],
    input[type="file"] {

      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d9e1ec;

      border-radius: 12px;

      font-size: 15px;

      background: white;

      outline: none;
    }


    input:focus {

      border-color: #4169e1;

      box-shadow:
        0 0 0 3px rgba(65, 105, 225, 0.08);
    }


    .file-box {

      border: 1px dashed #b7c5d9;

      border-radius: 14px;

      padding: 15px;

      background: #f8fbff;
    }


    .help {

      margin-top: 7px;

      font-size: 12px;

      color: #7a8699;

      line-height: 1.5;
    }


    .button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 15px;

      font-size: 16px;

      font-weight: 700;

      color: white;

      background:
        linear-gradient(
          135deg,
          #2457d6,
          #713fc8
        );

      cursor: pointer;
    }


    .button:disabled {

      opacity: 0.6;

      cursor: wait;
    }


    .loading {

      text-align: center;

      color: #667085;

      padding: 20px 0;
    }


    .message {

      display: none;

      text-align: center;

      padding: 22px;

      border-radius: 16px;

      margin-top: 18px;

      line-height: 1.7;
    }


    .success {

      background: #eefaf3;

      color: #176b3a;
    }


    .error {

      background: #fff1f1;

      color: #a32525;
    }


    .candidate-id {

      margin-top: 10px;

      font-size: 22px;

      font-weight: 800;

      letter-spacing: 1px;
    }


    .required {

      color: #d73535;
    }

  </style>

</head>


<body>


  <div class="container">

    <div class="header">

      <div class="logo">
        ATWORK
      </div>

      <div class="subtitle">

        ฝาก Resume ไว้กับเรา<br>

        เพื่อให้เจ้าหน้าที่นำไปพิจารณาตำแหน่งงานที่เหมาะสม

      </div>

    </div>


    <div
      id="loading"
      class="loading"
    >
      กำลังเตรียมระบบ...
    </div>


    <div
      id="formCard"
      class="card"
      style="display:none;"
    >

      <form id="resumeForm">


        <div class="field">

          <label>
            ชื่อ-นามสกุล
            <span class="required">*</span>
          </label>

          <input
            type="text"
            id="name"
            placeholder="กรอกชื่อ-นามสกุล"
            required
          >

        </div>


        <div class="field">

          <label>
            เบอร์โทรศัพท์
            <span class="required">*</span>
          </label>

          <input
            type="tel"
            id="phone"
            inputmode="numeric"
            placeholder="08XXXXXXXX"
            required
          >

        </div>


        <div class="field">

          <label>
            Resume
            <span class="required">*</span>
          </label>

          <div class="file-box">

            <input
              type="file"
              id="resume"
              accept=".pdf,.doc,.docx"
              required
            >

            <div class="help">

              รองรับ PDF, DOC, DOCX<br>
              ขนาดไม่เกิน 5 MB

            </div>

          </div>

        </div>


        <button
          type="submit"
          class="button"
          id="submitButton"
        >
          📄 ฝาก Resume
        </button>


      </form>

    </div>


    <div
      id="successMessage"
      class="message success"
    >

      <div style="font-size:32px;">
        ✅
      </div>

      <strong>
        ฝาก Resume เรียบร้อยแล้ว
      </strong>

      <div>
        หมายเลขผู้สมัคร
      </div>

      <div
        id="candidateId"
        class="candidate-id"
      >
      </div>

      <div style="margin-top:10px;">
        ทาง ATWORK จะเก็บ Resume
        ไว้สำหรับพิจารณาตำแหน่งงานที่เหมาะสม
      </div>

    </div>


    <div
      id="errorMessage"
      class="message error"
    >

      <strong>
        ไม่สามารถฝาก Resume ได้
      </strong>

      <div
        id="errorText"
        style="margin-top:8px;"
      >
      </div>

    </div>


  </div>


<script>

  const LIFF_ID =
    "2011817085-Mqy2mWhy";


  const APPS_SCRIPT_URL =
    "ใส่_URL_APPS_SCRIPT_ของคุณ";


  let lineUserId = "";


  /********************************
   * INIT LIFF
   ********************************/

  async function initLIFF() {

    try {

      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        liff.login({
          redirectUri:
            window.location.href
        });

        return;

      }


      const profile =
        await liff.getProfile();


      lineUserId =
        profile.userId || "";


      document.getElementById(
        "loading"
      ).style.display = "none";


      document.getElementById(
        "formCard"
      ).style.display = "block";


    } catch (error) {

      console.error(error);

      showError(
        "ไม่สามารถเชื่อมต่อ LINE ได้"
      );

    }

  }


  /********************************
   * FILE TO BASE64
   ********************************/

  function fileToBase64(file) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();


        reader.onload = function() {

          resolve(reader.result);

        };


        reader.onerror = function() {

          reject(
            new Error(
              "อ่านไฟล์ไม่ได้"
            )
          );

        };


        reader.readAsDataURL(file);

      }
    );

  }


  /********************************
   * SHOW ERROR
   ********************************/

  function showError(message) {

    const box =
      document.getElementById(
        "errorMessage"
      );


    document.getElementById(
      "errorText"
    ).textContent = message;


    box.style.display = "block";

  }


  /********************************
   * SUBMIT
   ********************************/

  document
    .getElementById("resumeForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const phone =
          document
            .getElementById("phone")
            .value
            .replace(/\D/g, "");


        const resume =
          document
            .getElementById("resume")
            .files[0];


        const button =
          document.getElementById(
            "submitButton"
          );


        document.getElementById(
          "errorMessage"
        ).style.display = "none";


        // ----------------------
        // ตรวจชื่อ
        // ----------------------

        if (!name) {

          showError(
            "กรุณากรอกชื่อ-นามสกุล"
          );

          return;

        }


        // ----------------------
        // ตรวจเบอร์
        // ----------------------

        if (!/^0\d{9}$/.test(phone)) {

          showError(
            "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก"
          );

          return;

        }


        // ----------------------
        // ตรวจ Resume
        // ----------------------

        if (!resume) {

          showError(
            "กรุณาเลือก Resume"
          );

          return;

        }


        // ----------------------
        // จำกัดขนาด 5 MB
        // ----------------------

        if (
          resume.size >
          5 * 1024 * 1024
        ) {

          showError(
            "Resume ต้องมีขนาดไม่เกิน 5 MB"
          );

          return;

        }


        // ----------------------
        // ตรวจนามสกุล
        // ----------------------

        const fileName =
          resume.name.toLowerCase();


        const allowed =
          [
            ".pdf",
            ".doc",
            ".docx"
          ];


        const valid =
          allowed.some(
            function(ext) {

              return fileName.endsWith(ext);

            }
          );


        if (!valid) {

          showError(
            "รองรับเฉพาะไฟล์ PDF, DOC และ DOCX"
          );

          return;

        }


        // ----------------------
        // เริ่มส่ง
        // ----------------------

        button.disabled = true;

        button.textContent =
          "กำลังฝาก Resume...";


        try {

          const base64 =
            await fileToBase64(
              resume
            );


          const params =
            new URLSearchParams();


          params.append(
            "action",
            "submitResume"
          );


          params.append(
            "lineUserId",
            lineUserId
          );


          params.append(
            "name",
            name
          );


          params.append(
            "phone",
            phone
          );


          params.append(
            "resumeName",
            resume.name
          );


          params.append(
            "resumeType",
            resume.type
          );


          params.append(
            "resumeBase64",
            base64
          );


          /*
           * ใช้ no-cors เพราะ GitHub Pages
           * กับ Apps Script อยู่คนละโดเมน
           */

          await fetch(
            APPS_SCRIPT_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/x-www-form-urlencoded;charset=UTF-8"
              },

              body:
                params.toString(),

              mode: "no-cors"
            }
          );


          /*
           * เนื่องจาก no-cors
           * เราอ่าน response จาก Apps Script
           * ไม่ได้ แต่ request ถูกส่งไปแล้ว
           */

          document.getElementById(
            "formCard"
          ).style.display = "none";


          document.getElementById(
            "candidateId"
          ).textContent =
            "กำลังสร้างหมายเลขผู้สมัคร";


          document.getElementById(
            "successMessage"
          ).style.display = "block";


          button.disabled = false;


        } catch (error) {

          console.error(error);


          button.disabled = false;

          button.textContent =
            "📄 ฝาก Resume";


          showError(
            "ไม่สามารถส่งข้อมูลได้ กรุณาลองใหม่"
          );

        }

      }
    );


  /********************************
   * START
   ********************************/

  initLIFF();

</script>

</body>

</html>
