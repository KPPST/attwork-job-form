<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ATWORK - สมัครงาน</title>

  <!-- LINE LIFF SDK -->
  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f7fb;
      color: #1f2937;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;

      border-radius: 20px;

      padding: 24px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);
    }

    /* ============================
       HEADER
    ============================ */

    .brand {
      text-align: center;

      color: #123c72;

      font-size: 30px;

      font-weight: 800;
    }

    .title {
      margin-top: 6px;

      text-align: center;

      font-size: 22px;

      font-weight: 700;
    }

    .subtitle {
      margin-top: 8px;
      margin-bottom: 22px;

      text-align: center;

      color: #6b7280;

      font-size: 14px;

      line-height: 1.6;
    }


    /* ============================
       STATUS
    ============================ */

    .status {
      margin-bottom: 18px;

      padding: 11px 12px;

      border-radius: 10px;

      text-align: center;

      font-size: 13px;

      background: #f8fafc;

      color: #64748b;
    }

    .status.success {
      background: #f0fdf4;
      color: #166534;
    }

    .status.error {
      background: #fef2f2;
      color: #991b1b;
    }


    /* ============================
       PROFILE
    ============================ */

    .profile {
      display: none;

      margin-bottom: 20px;

      padding: 12px 14px;

      border-radius: 12px;

      background: #f8fafc;

      color: #64748b;

      font-size: 13px;
    }

    .profile.show {
      display: block;
    }

    .profile-name {
      color: #123c72;

      font-weight: 700;
    }


    /* ============================
       SECTION
    ============================ */

    .section-title {
      margin-top: 26px;

      margin-bottom: 14px;

      color: #123c72;

      font-size: 17px;

      font-weight: 700;
    }


    /* ============================
       FORM
    ============================ */

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: 600;
    }

    .required {
      color: #dc2626;
    }

    input,
    select {
      width: 100%;

      height: 48px;

      margin-bottom: 16px;

      padding: 0 14px;

      border: 1px solid #d1d5db;

      border-radius: 10px;

      background: #ffffff;

      color: #111827;

      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    /* ============================
       RESUME
    ============================ */

    .resume-box {
      padding: 16px;

      border: 2px dashed #cbd5e1;

      border-radius: 12px;

      background: #f8fafc;
    }

    .resume-box input[type="file"] {
      height: auto;

      margin: 0;

      padding: 0;

      border: none;

      box-shadow: none;

      background: transparent;
    }

    .file-name {
      margin-top: 9px;

      color: #475569;

      font-size: 12px;

      line-height: 1.5;

      word-break: break-word;
    }

    .hint {
      margin-top: 8px;

      color: #64748b;

      font-size: 12px;

      line-height: 1.5;
    }


    /* ============================
       BUTTON
    ============================ */

    .submit-btn {
      width: 100%;

      height: 50px;

      margin-top: 22px;

      border: none;

      border-radius: 12px;

      background: #123c72;

      color: #ffffff;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }


    /* ============================
       LOADING
    ============================ */

    .loading {
      display: none;

      margin-top: 15px;

      text-align: center;

      color: #64748b;

      font-size: 14px;
    }

    .loading.show {
      display: block;
    }


    /* ============================
       MESSAGE
    ============================ */

    .message {
      display: none;

      margin-top: 18px;

      padding: 15px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.7;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #ecfdf5;

      color: #166534;
    }

    .message.error {
      background: #fef2f2;

      color: #991b1b;
    }


    /* ============================
       FOOTER
    ============================ */

    .footer-note {
      margin-top: 20px;

      text-align: center;

      color: #94a3b8;

      font-size: 11px;

      line-height: 1.6;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">


      <!-- ============================
           HEADER
      ============================ -->

      <div class="brand">
        ATWORK
      </div>

      <div class="title">
        สมัครงาน
      </div>

      <div class="subtitle">
        กรุณากรอกข้อมูลสำหรับสมัครงานให้ครบถ้วน
      </div>


      <!-- ============================
           LINE STATUS
      ============================ -->

      <div
        id="lineStatus"
        class="status"
      >
        กำลังเชื่อมต่อ LINE...
      </div>


      <!-- ============================
           PROFILE
      ============================ -->

      <div
        id="profileBox"
        class="profile"
      >

        สวัสดีครับ

        <span
          id="profileName"
          class="profile-name"
        ></span>

      </div>


      <!-- ============================
           FORM
      ============================ -->

      <form id="jobForm">


        <!-- LINE USER ID -->

        <input
          type="hidden"
          id="lineUserId"
          name="lineUserId"
        >


        <!-- ============================
             PERSONAL INFORMATION
        ============================ -->

        <div class="section-title">
          ข้อมูลส่วนตัว
        </div>


        <label for="name">

          ชื่อ-นามสกุล

          <span class="required">
            *
          </span>

        </label>


        <input
          type="text"
          id="name"
          name="name"
          placeholder="กรอกชื่อ-นามสกุล"
          autocomplete="name"
          required
        >


        <label for="phone">

          เบอร์โทรศัพท์

          <span class="required">
            *
          </span>

        </label>


        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="เช่น 0812345678"
          maxlength="10"
          inputmode="numeric"
          autocomplete="tel"
          required
        >


        <!-- ============================
             JOB INFORMATION
        ============================ -->

        <div class="section-title">
          ข้อมูลการสมัครงาน
        </div>


        <label for="jobType">

          สายงานที่สนใจ

          <span class="required">
            *
          </span>

        </label>


        <select
          id="jobType"
          name="jobType"
          required
        >

          <option value="">
            กำลังโหลดสายงาน...
          </option>

        </select>


        <label for="province">

          จังหวัดที่ต้องการทำงาน

          <span class="required">
            *
          </span>

        </label>


        <select
          id="province"
          name="province"
          required
        >

          <option value="">
            กำลังโหลดจังหวัด...
          </option>

        </select>


        <!-- ============================
             RESUME
        ============================ -->

        <div class="section-title">
          Resume
        </div>


        <div class="resume-box">

          <label for="resume">
            แนบ Resume
          </label>


          <input
            type="file"
            id="resume"
            name="resume"
            accept=".pdf,.doc,.docx"
          >


          <div
            id="fileName"
            class="file-name"
          >
            ยังไม่ได้เลือกไฟล์
          </div>


          <div class="hint">

            รองรับ PDF, DOC และ DOCX

            <br>

            ขนาดไม่เกิน 5 MB

          </div>

        </div>


        <!-- ============================
             SUBMIT
        ============================ -->

        <button
          type="submit"
          id="submitBtn"
          class="submit-btn"
        >

          ส่งใบสมัคร

        </button>


      </form>


      <!-- ============================
           LOADING
      ============================ -->

      <div
        id="loading"
        class="loading"
      >

        กำลังส่งใบสมัคร...

      </div>


      <!-- ============================
           SUCCESS
      ============================ -->

      <div
        id="result"
        class="message success"
      ></div>


      <!-- ============================
           ERROR
      ============================ -->

      <div
        id="error"
        class="message error"
      ></div>


      <div class="footer-note">
        ATWORK Recruitment
      </div>


    </div>

  </div>


  <script>


    // =================================================
    // CONFIG
    // =================================================

    const LIFF_ID =
      "2011817085-Mqy2mWhy";


    /*
     * URL ของ Google Apps Script Web App
     *
     * ตัวอย่าง:
     *
     * https://script.google.com/macros/s/XXXXXXXX/exec
     *
     */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxV0GeGa3dAAX-OKGmJI8uciHeJ-NnpA3YrKVnA45WZkBQBTnWdV3HcrPUuXYS4NnNB/exec";


    // =================================================
    // DOM
    // =================================================

    const lineStatus =
      document.getElementById(
        "lineStatus"
      );


    const profileBox =
      document.getElementById(
        "profileBox"
      );


    const profileName =
      document.getElementById(
        "profileName"
      );


    const lineUserId =
      document.getElementById(
        "lineUserId"
      );


    const jobTypeSelect =
      document.getElementById(
        "jobType"
      );


    const provinceSelect =
      document.getElementById(
        "province"
      );


    const resumeInput =
      document.getElementById(
        "resume"
      );


    const fileName =
      document.getElementById(
        "fileName"
      );


    const form =
      document.getElementById(
        "jobForm"
      );


    const submitBtn =
      document.getElementById(
        "submitBtn"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const resultBox =
      document.getElementById(
        "result"
      );


    const errorBox =
      document.getElementById(
        "error"
      );


    // =================================================
    // Resume filename
    // =================================================

    resumeInput.addEventListener(
      "change",
      function () {

        if (
          resumeInput.files &&
          resumeInput.files.length > 0
        ) {

          fileName.textContent =
            "ไฟล์ที่เลือก: " +
            resumeInput.files[0].name;

        } else {

          fileName.textContent =
            "ยังไม่ได้เลือกไฟล์";

        }

      }
    );


    // =================================================
    // LIFF INIT
    // =================================================

    async function initLIFF() {

      try {

        await liff.init({

          liffId:
            LIFF_ID

        });


        /*
         * เปิดใน LINE
         */

        if (
          liff.isInClient()
        ) {

          lineStatus.textContent =
            "เชื่อมต่อ LINE เรียบร้อยแล้ว";

          lineStatus.className =
            "status success";

        }


        /*
         * เปิดใน Browser ภายนอก
         */

        else {

          if (
            !liff.isLoggedIn()
          ) {

            liff.login({

              redirectUri:
                window.location.href

            });

            return;

          }


          lineStatus.textContent =
            "เข้าสู่ระบบ LINE เรียบร้อยแล้ว";

          lineStatus.className =
            "status success";

        }


        /*
         * อ่าน Profile
         */

        const profile =
          await liff.getProfile();


        /*
         * เก็บ LINE User ID
         */

        lineUserId.value =
          profile.userId || "";


        /*
         * แสดงชื่อ
         */

        profileName.textContent =
          profile.displayName || "";


        profileBox.classList.add(
          "show"
        );


      } catch (error) {

        console.error(
          "LIFF Error:",
          error
        );


        lineStatus.textContent =
          "ไม่สามารถเชื่อมต่อ LINE ได้";


        lineStatus.className =
          "status error";


        showError(
          "กรุณาเปิดแบบฟอร์มนี้จาก LINE อีกครั้ง"
        );

      }

    }


    // =================================================
    // JSONP Loader
    // =================================================

    function loadJsonp(api) {

      return new Promise(
        function(resolve, reject) {

          const callbackName =
            "attwork_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() * 100000
            );


          let finished = false;


          const script =
            document.createElement(
              "script"
            );


          function cleanup() {

            delete window[
              callbackName
            ];


            if (
              script.parentNode
            ) {

              script.parentNode.removeChild(
                script
              );

            }

          }


          window[callbackName] =
            function(data) {

              if (finished) {
                return;
              }


              finished = true;


              cleanup();


              resolve(data);

            };


          script.onerror =
            function() {

              if (finished) {
                return;
              }


              finished = true;


              cleanup();


              reject(
                new Error(
                  "ไม่สามารถเชื่อมต่อ Apps Script ได้"
                )
              );

            };


          const separator =
            APPS_SCRIPT_URL.includes("?")
              ? "&"
              : "?";


          script.src =
            APPS_SCRIPT_URL +
            separator +
            "api=" +
            encodeURIComponent(api) +
            "&callback=" +
            encodeURIComponent(
              callbackName
            );


          document.body.appendChild(
            script
          );

        }
      );

    }


    // =================================================
    // Load Job Types
    // =================================================

    async function loadJobTypes() {

      try {

        const jobTypes =
          await loadJsonp(
            "jobTypes"
          );


        jobTypeSelect.innerHTML =
          '<option value="">-- เลือกสายงาน --</option>';


        if (
          !Array.isArray(jobTypes) ||
          jobTypes.length === 0
        ) {

          jobTypeSelect.innerHTML +=
            '<option value="">ไม่พบรายการสายงาน</option>';

          return;

        }


        jobTypes.forEach(
          function(jobType) {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              jobType;


            option.textContent =
              jobType;


            jobTypeSelect.appendChild(
              option
            );

          }
        );


      } catch (error) {

        console.error(
          "Job Types Error:",
          error
        );


        jobTypeSelect.innerHTML =
          '<option value="">โหลดสายงานไม่สำเร็จ</option>';

      }

    }


    // =================================================
    // Load Provinces
    // =================================================

    async function loadProvinces() {

      try {

        const provinces =
          await loadJsonp(
            "provinces"
          );


        provinceSelect.innerHTML =
          '<option value="">-- เลือกจังหวัด --</option>';


        if (
          !Array.isArray(provinces) ||
          provinces.length === 0
        ) {

          provinceSelect.innerHTML +=
            '<option value="">ไม่พบรายการจังหวัด</option>';

          return;

        }


        provinces.forEach(
          function(province) {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              province;


            option.textContent =
              province;


            provinceSelect.appendChild(
              option
            );

          }
        );


      } catch (error) {

        console.error(
          "Province Error:",
          error
        );


        provinceSelect.innerHTML =
          '<option value="">โหลดจังหวัดไม่สำเร็จ</option>';

      }

    }


    // =================================================
    // Validate
    // =================================================

    function validateForm() {

      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      if (!lineUserId.value) {

        showError(
          "ไม่พบข้อมูล LINE กรุณาเปิดฟอร์มจาก LINE"
        );

        return false;

      }


      if (!name) {

        showError(
          "กรุณากรอกชื่อ-นามสกุล"
        );

        return false;

      }


      if (
        !/^0\d{9}$/.test(phone)
      ) {

        showError(
          "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก เช่น 0812345678"
        );

        return false;

      }


      if (
        !jobTypeSelect.value
      ) {

        showError(
          "กรุณาเลือกสายงานที่สนใจ"
        );

        return false;

      }


      if (
        !provinceSelect.value
      ) {

        showError(
          "กรุณาเลือกจังหวัดที่ต้องการทำงาน"
        );

        return false;

      }


      return true;

    }


    // =================================================
    // File → Base64
    // =================================================

    function fileToBase64(file) {

      return new Promise(
        function(resolve, reject) {

          const reader =
            new FileReader();


          reader.onload =
            function() {

              const result =
                String(
                  reader.result || ""
                );


              const parts =
                result.split(",");


              if (
                parts.length < 2
              ) {

                reject(
                  new Error(
                    "ไม่สามารถอ่านไฟล์ได้"
                  )
                );

                return;

              }


              resolve(
                parts[1]
              );

            };


          reader.onerror =
            function() {

              reject(
                reader.error ||
                new Error(
                  "อ่านไฟล์ไม่สำเร็จ"
                )
              );

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }


    // =================================================
    // Submit Form
    // =================================================

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        hideMessages();


        // ---------------------------------------------
        // ตรวจ Form
        // ---------------------------------------------

        if (
          !validateForm()
        ) {

          return;

        }


        // ---------------------------------------------
        // ตรวจ ID Token
        // ---------------------------------------------

        const idToken =
          liff.getIDToken();


        if (!idToken) {

          showError(
            "ไม่พบข้อมูลยืนยันบัญชี LINE"
          );

          return;

        }


        // ---------------------------------------------
        // ข้อมูล
        // ---------------------------------------------

        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const phone =
          document
            .getElementById("phone")
            .value
            .trim();


        const jobType =
          jobTypeSelect.value;


        const province =
          provinceSelect.value;


        // ---------------------------------------------
        // Resume
        // ---------------------------------------------

        let resumeBase64 =
          "";

        let resumeName =
          "";

        let resumeType =
          "";


        const file =
          resumeInput.files &&
          resumeInput.files.length > 0
            ? resumeInput.files[0]
            : null;


        if (file) {

          const maxSize =
            5 * 1024 * 1024;


          if (
            file.size > maxSize
          ) {

            showError(
              "Resume ต้องมีขนาดไม่เกิน 5 MB"
            );

            return;

          }


          const allowedTypes = [

            "application/pdf",

            "application/msword",

            "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

          ];


          if (
            !allowedTypes.includes(
              file.type
            )
          ) {

            showError(
              "รองรับเฉพาะ PDF, DOC และ DOCX"
            );

            return;

          }


          try {

            resumeBase64 =
              await fileToBase64(
                file
              );


            resumeName =
              file.name;


            resumeType =
              file.type;


          } catch (error) {

            console.error(
              error
            );


            showError(
              "ไม่สามารถอ่าน Resume ได้"
            );

            return;

          }

        }


        // ---------------------------------------------
        // สร้าง Candidate ID
        // ---------------------------------------------

        const candidateId =
          "C" +
          Date.now();


        // ---------------------------------------------
        // สร้าง POST Data
        // ---------------------------------------------

        const params =
          new URLSearchParams();


        params.append(
          "action",
          "submitCandidate"
        );


        params.append(
          "candidateId",
          candidateId
        );


        params.append(
          "idToken",
          idToken
        );


        params.append(
          "name",
          name
        );


        params.append(
          "phone",
          phone
        );


        params.append(
          "jobType",
          jobType
        );


        params.append(
          "province",
          province
        );


        params.append(
          "resumeName",
          resumeName
        );


        params.append(
          "resumeType",
          resumeType
        );


        params.append(
          "resumeBase64",
          resumeBase64
        );


        // ---------------------------------------------
        // Loading
        // ---------------------------------------------

        submitBtn.disabled =
          true;


        submitBtn.textContent =
          "กำลังส่งใบสมัคร...";


        loading.classList.add(
          "show"
        );


        // ---------------------------------------------
        // POST Apps Script
        // ---------------------------------------------

        try {

          await fetch(
            APPS_SCRIPT_URL,
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/x-www-form-urlencoded;charset=UTF-8"

              },

              body:
                params.toString(),

              mode:
                "no-cors"

            }
          );


          // -----------------------------------------
          // แสดง Success
          // -----------------------------------------

          showSuccess(

            "✅ ส่งใบสมัครเรียบร้อยแล้ว<br><br>" +

            "หมายเลขผู้สมัคร: <strong>" +
            candidateId +
            "</strong><br><br>" +

            "ขอบคุณที่สมัครงานกับ ATWORK"

          );


          /*
           * ไม่ล้าง lineUserId
           * เพราะยังอยู่ใน LIFF session
           */

          form.reset();


          lineUserId.value =
            lineUserId.value;


          fileName.textContent =
            "ยังไม่ได้เลือกไฟล์";


        } catch (error) {

          console.error(
            "Submit Error:",
            error
          );


          showError(
            "ไม่สามารถส่งใบสมัครได้ กรุณาลองใหม่อีกครั้ง"
          );

        } finally {

          loading.classList.remove(
            "show"
          );


          submitBtn.disabled =
            false;


          submitBtn.textContent =
            "ส่งใบสมัคร";

        }

      }
    );


    // =================================================
    // Success
    // =================================================

    function showSuccess(
      message
    ) {

      resultBox.innerHTML =
        message;


      resultBox.classList.add(
        "show"
      );

    }


    // =================================================
    // Error
    // =================================================

    function showError(
      message
    ) {

      errorBox.textContent =
        "❌ " + message;


      errorBox.classList.add(
        "show"
      );

    }


    // =================================================
    // Hide Messages
    // =================================================

    function hideMessages() {

      resultBox.classList.remove(
        "show"
      );


      errorBox.classList.remove(
        "show"
      );

    }


    // =================================================
    // START
    // =================================================

    initLIFF();

    loadJobTypes();

    loadProvinces();

  </script>

</body>

</html>
